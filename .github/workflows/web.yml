# Builds the playable web version on every push to main and publishes it to
# GitHub Pages: https://zephino.github.io/The_Last_Wagon/
# The smoke test runs first; if it fails, nothing is published.
# Needs Settings -> Pages -> Source set to "GitHub Actions".
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$templates/"
          rm -f godot.zip templates.tpz

      - name: Import project
        run: |
          godot --headless --import --path . 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Failed to load script|Parse Error' import.log; then
            echo "::error::Script errors during import"
            exit 1
          fi

      - name: Smoke test
        run: |
          godot --headless --path . -s res://scripts/tests/smoke_test.gd 2>&1 | tee smoke.log
          grep -q "SMOKE TEST PASSED" smoke.log
          if grep -q "SCRIPT ERROR" smoke.log; then
            echo "::error::Script errors during the smoke test"
            exit 1
          fi

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.pck

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
